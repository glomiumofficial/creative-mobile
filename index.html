<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glomium — creative INFINITELY</title>
<meta name="description" content="Glomium Technologies Pvt Ltd — creative INFINITELY.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/wordmark-green.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root { --green: #10AF8B; --green-deep: #0A6E58; --ink: #0A6E58; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #FFFFFF; color: var(--ink); font-family: 'Jost', Helvetica, sans-serif; overflow-x: hidden; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
  a { color: var(--ink); text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a:active { color: #064A3B; }
  ::selection { background: var(--green); color: #FFFFFF; }
  @keyframes cueM { 0%,100% { transform: translateY(0); opacity: .25 } 50% { transform: translateY(8px); opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { [data-el="cue"] i { animation: none } }
</style>
</head>
<body>
<div style="position:relative; width:100%; background:#FFFFFF">
  <div data-el="track" style="position:relative; height:560svh">
    <div data-el="stage" style="position:sticky; top:0; height:100svh; overflow:hidden">

      <div data-el="depth" style="position:absolute; inset:-12%; z-index:0; pointer-events:none; background:radial-gradient(98% 92% at 50% 42%, rgba(16,175,139,.05), rgba(16,175,139,.018) 38%, rgba(16,175,139,.004) 66%, rgba(255,255,255,0) 88%); will-change:transform"></div>

      <div data-layer="story" style="position:absolute; inset:0; z-index:1; pointer-events:none">
        <svg data-el="inf" viewBox="0 40 40 30" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; display:block; will-change:opacity">
          <path d="M20,50 C20,10 60,10 100,50 C140,90 180,90 180,50 C180,10 140,10 100,50 C60,90 20,90 20,50 Z" fill="none" stroke="var(--green)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path>
        </svg>

        <p data-el="line" style="position:absolute; left:max(18px,6vw); right:7vw; bottom:19svh; margin:0; font-size:clamp(21px,6.2vw,30px); font-weight:200; line-height:1.38; letter-spacing:.005em; color:var(--ink); opacity:0; will-change:transform,opacity; text-wrap:pretty">We build the systems that carry a business forward — and then we keep them running.</p>

        <div data-el="payoff" style="position:absolute; left:0; right:0; top:50svh; display:flex; flex-direction:column; align-items:center; gap:clamp(10px,3vw,16px); opacity:0; will-change:transform,opacity">
          <span style="font-size:clamp(12px,3.4vw,15px); font-weight:300; letter-spacing:.42em; text-indent:.42em; color:var(--green-deep)">creative</span>
          <span data-el="payoffBig" style="font-size:clamp(30px,10.6vw,52px); font-weight:200; letter-spacing:.2em; text-indent:.2em; line-height:1; color:var(--ink); filter:drop-shadow(0 10px 20px rgba(10,110,88,.14))">INFINITELY</span>
        </div>
      </div>

      <div data-layer="head" style="position:absolute; inset:0; z-index:4; pointer-events:none">
        <img data-el="wm" src="assets/wordmark-green.png" alt="Glomium" decoding="async" style="position:absolute; left:0; top:0; width:min(80vw,58svh); transform-origin:0 0; display:block; will-change:transform; filter:drop-shadow(0 8px 18px rgba(10,110,88,.16))">
        <div data-el="cue" style="position:absolute; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:9px; will-change:opacity">
          <span style="font-size:10px; letter-spacing:.36em; text-indent:.36em; text-transform:uppercase; color:var(--ink)">Scroll</span>
          <i style="display:block; width:1px; height:32px; background:linear-gradient(180deg,var(--green),transparent); animation:cueM 2.4s ease-in-out infinite"></i>
        </div>
      </div>

    </div>
  </div>

  <footer id="footer" data-el="footer" style="position:relative; z-index:5; background:#FFFFFF; padding:26px 7vw calc(20px + env(safe-area-inset-bottom)); border-top:1px solid rgba(16,175,139,.12); display:flex; flex-direction:column; gap:18px">
    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px">
      <img src="assets/wordmark-green.png" alt="Glomium" loading="lazy" decoding="async" style="width:96px; display:block">
      <a href="mailto:hello@glomium.in" style="font-size:15px; font-weight:300; letter-spacing:.015em; color:var(--green-deep); white-space:nowrap">hello@glomium.in</a>
    </div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px 16px">
      <span style="font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#67736F">© 2026 Glomium Technologies</span>
      <span style="font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#67736F; white-space:nowrap">creative <span style="color:#48544F; letter-spacing:.26em">INFINITELY</span></span>
    </div>
  </footer>
</div>
<script src="site.js"></script>
</body>
</html>
